{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-accent"><i class="fa-solid fa-wallet me-2"></i>Nova Conta</h2>
            <a href="{{ url_for('contas.index') }}" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Voltar</a>
        </div>

        <div class="card shadow-sm border-0 bg-dark text-light p-4">
            <p class="text-muted small mb-4">
                Cadastre aqui suas contas bancárias, carteiras ou dinheiro em espécie para vincular às suas movimentações financeiras.
            </p>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nome da Conta</label>
                    <input type="text" name="nome" class="form-control bg-dark text-light border-secondary" placeholder="Ex: Nubank, Carteira, Itaú" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Tipo de Conta</label>
                        <select name="tipo" class="form-select bg-dark text-light border-secondary">
                            <option value="corrente">Conta Corrente</option>
                            <option value="poupanca">Poupança</option>
                            <option value="carteira">Carteira / Dinheiro</option>
                            <option value="investimento">Investimento</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Saldo Inicial (R$)</label>
                        <input type="number" step="0.01" name="saldo_inicial" class="form-control bg-dark text-light border-secondary" value="0.00" required>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{{ url_for('contas.index') }}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-1"></i> Salvar Conta</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
