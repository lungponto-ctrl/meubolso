<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppMeuBolso</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .text-accent {
            color: #58a6ff;
        }
        .navbar {
            background-color: #161b22 !important;
            border-bottom: 1px solid #30363d;
        }
        .nav-link {
            color: #8b949e !important;
            font-weight: 500;
        }
        .nav-link:hover, .nav-link.active {
            color: #ffffff !important;
        }
    </style>
</head>
<body>

    <!-- Barra de Navegação -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-accent" href="{{ url_for('index') }}">
                <i class="fa-solid fa-wallet me-2"></i>AppMeuBolso
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto gap-2">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">
                            <i class="fa-solid fa-chart-pie me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('contas.index') }}">
                            <i class="fa-solid fa-wallet me-1"></i> Contas
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('cartoes.index') }}">
                            <i class="fa-solid fa-credit-card me-1"></i> Cartões
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('transacoes.index') }}">
                            <i class="fa-solid fa-exchange-alt me-1"></i> Transações
                        </a>
                    </li>
                    <!-- Nova Aba de Contas Recorrentes / Fixas -->
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('recorrentes.index') }}">
                            <i class="fa-solid fa-calendar-check me-1"></i> Contas Fixas
                        </a>
                    </li>
                </ul>

                <!-- Menu de Autenticação (Usuário, Alterar Senha e Sair) -->
                <ul class="navbar-nav ms-auto align-items-lg-center gap-2 mt-3 mt-lg-0">
                    <li class="nav-item me-lg-2">
                        <span class="text-light small"><i class="fa-solid fa-user-circle me-1 text-success"></i> <b>Daniely</b></span>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-outline-secondary btn-sm text-light border-secondary w-100" href="{{ url_for('alterar_senha') }}">
                            <i class="fa-solid fa-key me-1"></i> Alterar Senha
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-danger btn-sm w-100" href="{{ url_for('logout') }}">
                            <i class="fa-solid fa-right-from-bracket me-1"></i> Sair
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <div class="container mb-5">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
