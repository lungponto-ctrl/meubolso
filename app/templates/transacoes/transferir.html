{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-accent"><i class="fa-solid fa-right-left me-2"></i>Nova Transferência</h2>
            <a href="{{ url_for('transacoes.index') }}" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Voltar</a>
        </div>

        {% if erro %}
            <div class="alert alert-danger" role="alert">{{ erro }}</div>
        {% endif %}

        <div class="card shadow-sm border-0 bg-dark text-light p-4">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Descrição / Motivo</label>
                    <input type="text" name="descricao" class="form-control bg-dark text-light border-secondary" placeholder="Ex: Pix para poupança, Retirada para carteira" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Conta de Origem (Sai o dinheiro)</label>
                        <select name="conta_origem_id" class="form-select bg-dark text-light border-secondary" required>
                            {% for conta in contas %}
                                <option value="{{ conta.id }}">{{ conta.nome }} ({{ conta.tipo }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Conta de Destino (Entra o dinheiro)</label>
                        <select name="conta_destino_id" class="form-select bg-dark text-light border-secondary" required>
                            {% for conta in contas %}
                                <option value="{{ conta.id }}">{{ conta.nome }} ({{ conta.tipo }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Valor da Transferência (R$)</label>
                    <input type="number" step="0.01" name="valor" class="form-control bg-dark text-light border-secondary" placeholder="0.00" required>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{{ url_for('transacoes.index') }}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-right-left me-1"></i> Realizar Transferência</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
