{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 bg-dark text-light p-4">
            <h2 class="fw-bold text-accent mb-4"><i class="fa-solid fa-pen-to-square me-2"></i>Editar Transação</h2>
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label text-muted">Descrição</label>
                    <input type="text" name="descricao" value="{{ transacao.descricao }}" class="form-control bg-dark text-light border-secondary" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label text-muted">Valor (R$)</label>
                    <input type="number" step="0.01" name="valor" value="{{ transacao.valor }}" class="form-control bg-dark text-light border-secondary" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted">Tipo</label>
                    <select name="tipo" class="form-select bg-dark text-light border-secondary" required>
                        <option value="receita" {% if transacao.tipo == 'receita' %}selected{% endif %}>Receita</option>
                        <option value="despesa" {% if transacao.tipo == 'despesa' %}selected{% endif %}>Despesa</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted">Conta</label>
                    <select name="conta_id" class="form-select bg-dark text-light border-secondary" required>
                        {% for conta in contas %}
                            <option value="{{ conta.id }}" {% if transacao.conta_id == conta.id %}selected{% endif %}>{{ conta.nome }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('transacoes.index') }}" class="btn btn-outline-secondary"><i class="fa-solid fa-arrow-left me-1"></i> Voltar</a>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk me-1"></i> Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
